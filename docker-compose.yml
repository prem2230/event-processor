services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: event-platform-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: bitnami/kafka:3.7
    container_name: event-platform-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transaction.created --partitions 1 --replication-factor 1
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic notification.created --partitions 1 --replication-factor 1
    restart: "no"

  user-service:
    build:
      context: ./services/user-service
    container_name: event-platform-user-service
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: development
      LOG_FORMAT: json
      LOG_LEVEL: info
      PORT: "3004"
      MONGO_URI: ${USER_SERVICE_MONGO_URI:?Set USER_SERVICE_MONGO_URI in the root .env file}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-service-token}

  account-service:
    build:
      context: ./services/account-service
    container_name: event-platform-account-service
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: development
      LOG_FORMAT: json
      LOG_LEVEL: info
      PORT: "3005"
      MONGO_URI: ${ACCOUNT_SERVICE_MONGO_URI:?Set ACCOUNT_SERVICE_MONGO_URI in the root .env file}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-service-token}
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: account-service
      KAFKA_TRANSACTION_CREATED_TOPIC: transaction.created
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: event-platform-api-gateway
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      LOG_FORMAT: json
      LOG_LEVEL: info
      PORT: "3000"
      USER_SERVICE_URL: http://user-service:3004
      ACCOUNT_SERVICE_URL: http://account-service:3005
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-service-token}
      JWT_SECRET: ${JWT_SECRET:-replace-this-local-jwt-secret-with-32-characters}
      JWT_ISSUER: banking-api-gateway
      JWT_AUDIENCE: banking-platform
      JWT_EXPIRES_IN_SECONDS: "900"
      UPSTREAM_TIMEOUT_MS: "3000"
    depends_on:
      user-service:
        condition: service_started
      account-service:
        condition: service_started

  event-processor:
    build:
      context: ./services/event-processor
    container_name: event-platform-event-processor
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      LOG_FORMAT: json
      LOG_LEVEL: info
      PORT: "4000"
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: event-processor
      KAFKA_GROUP_ID: transaction-processors
      KAFKA_TRANSACTION_CREATED_TOPIC: transaction.created
      KAFKA_NOTIFICATION_CREATED_TOPIC: notification.created
      MONGO_URI: ${EVENT_PROCESSOR_MONGO_URI:?Set EVENT_PROCESSOR_MONGO_URI in the root .env file}
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  notification-service:
    build:
      context: ./services/notification-service
    container_name: event-platform-notification-service
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      LOG_FORMAT: json
      LOG_LEVEL: info
      PORT: "3002"
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: notification-service
      KAFKA_GROUP_ID: notification-service-group
      KAFKA_NOTIFICATION_CREATED_TOPIC: notification.created
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes:
  kafka-data:
